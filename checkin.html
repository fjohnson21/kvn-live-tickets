<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Confirmed • KVN Live Tickets</title><link rel="stylesheet" href="/styles.css"></head><body><header class="nav"><a class="brand" href="/"><span class="brand-mark">KV</span><span>KVN LIVE TICKETS</span></a></header><main class="shell"><section class="hero" style="min-height:75vh"><div><span class="kicker">ORDER CONFIRMED</span><h1>You're<br><span>In.</span></h1><p id="summary">Loading your order…</p><div id="tickets"></div><a class="btn primary" href="/">Explore More Events</a></div><div class="hero-card"><span class="badge">YOUR TICKETS</span><strong>Keep your unique ticket codes available for event check-in.</strong><p>Production version can email these automatically and render scannable QR codes once your transactional email provider is connected.</p></div></section></main><script>const p=new URLSearchParams(location.search);fetch('/api/checkout-session?session_id='+encodeURIComponent(p.get('session_id')||'')).then(r=>r.json()).then(d=>{if(d.error)throw new Error(d.error);summary.textContent=`Payment ${d.session.payment_status}. Order ${d.order?.id||''}`;tickets.innerHTML=(d.order?.tickets||[]).map(t=>`<div class="card" style="margin:10px 0"><strong>${t.ticketName}</strong><div class="kicker" style="margin-top:8px">${t.code}</div></div>`).join('')}).catch(e=>summary.textContent=e.message)</script></body></html>
