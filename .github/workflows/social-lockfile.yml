name: social-lockfile
on:
  push:
    branches:
      - codex/kv-social-postgres-email
permissions:
  contents: write
jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/kv-social-postgres-email
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock-only --ignore-scripts
      - run: |
          if git diff --quiet -- package-lock.json && [ -f package-lock.json ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Generate Social branch package lock"
          git push origin HEAD:codex/kv-social-postgres-email
