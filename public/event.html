<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event • KVN Live Tickets</title><link rel="stylesheet" href="/styles.css"></head><body class="event-page"><header class="nav"><a class="brand" href="/"><span class="brand-mark">KV</span><span>KVN LIVE TICKETS</span></a><nav><a href="/">All Events</a><button id="openCart" class="pill">Cart <span id="cartCount">0</span></button></nav></header><main id="page"></main>
<aside class="drawer" id="drawer"><div class="backdrop" id="backdrop"></div><div class="drawer-panel"><div class="drawer-head"><div><span class="kicker">YOUR ORDER</span><h2>Cart</h2></div><button class="btn small" id="closeCart">Close</button></div><div id="cartRows"></div><div class="form-stack checkout-fields" style="margin-top:18px"><label>Full name<input id="buyerName" autocomplete="name" required></label><label>Email<input id="buyerEmail" type="email" autocomplete="email" required></label><label>Cell phone<input id="buyerPhone" type="tel" autocomplete="tel" required></label><fieldset><legend>Billing address</legend><label>Street address<input id="billingLine1" autocomplete="billing address-line1" required></label><label>Apartment, suite, etc.<input id="billingLine2" autocomplete="billing address-line2"></label><div class="two-col"><label>City<input id="billingCity" autocomplete="billing address-level2" required></label><label>State<input id="billingState" autocomplete="billing address-level1" required></label></div><div class="two-col"><label>ZIP / postal code<input id="billingPostalCode" autocomplete="billing postal-code" required></label><label>Country<input id="billingCountry" autocomplete="billing country" value="US" required></label></div></fieldset><label class="check-row"><input id="mailingSameAsBilling" type="checkbox" checked> Mailing address is the same as billing</label><fieldset id="mailingFields"><legend>Mailing address</legend><label>Street address<input id="mailingLine1" autocomplete="shipping address-line1" required></label><label>Apartment, suite, etc.<input id="mailingLine2" autocomplete="shipping address-line2"></label><div class="two-col"><label>City<input id="mailingCity" autocomplete="shipping address-level2" required></label><label>State<input id="mailingState" autocomplete="shipping address-level1" required></label></div><div class="two-col"><label>ZIP / postal code<input id="mailingPostalCode" autocomplete="shipping postal-code" required></label><label>Country<input id="mailingCountry" autocomplete="shipping country" value="US" required></label></div></fieldset><label>Discount code<input id="discountCode" placeholder="Optional"></label></div><div class="cart-total"><span>Subtotal</span><strong id="cartTotal">$0.00</strong></div><button class="btn primary" style="width:100%" id="checkout">Secure Checkout</button><div class="error" id="checkoutError"></div></div></aside><script src="/event.js"></script></body></html>
