<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>KV Production Team | Performance Agreement</title><link rel="stylesheet" href="/performance-agreement.css"></head><body><main><p class="eyebrow">KV PRODUCTION TEAM</p><h1>Your performance agreement</h1><p id="notice" role="status">Loading your private agreement…</p><section id="document" hidden><h2 id="recipient"></h2><p id="version"></p><pre id="terms"></pre><button id="download" type="button">Save agreement copy</button><section id="accepted" hidden></section><form id="acceptance"><h2>Confirm your identity</h2><p>Request a verification code at the email address on this agreement.</p><button id="sendCode" type="button">Email my verification code</button><label>Verification code<input id="code" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"></label><label>Your full legal name<input id="name" required maxlength="150" autocomplete="name"></label><label>Email on the agreement<input id="email" required type="email" autocomplete="email"></label><label class="consent"><input id="consent" type="checkbox" required><span id="consentText"></span></label><button id="submit" type="submit">I agree and accept</button></form></section></main><script src="/performance-agreement.js"></script></body></html>
