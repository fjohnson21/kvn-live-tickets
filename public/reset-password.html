<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Cache-Control" content="no-store"><title>Reset Password • KVN Control Center</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><section class="card login-card"><span class="kicker">SECURE WORKSPACE</span><h1>Create a New Password</h1><p class="muted">Use at least 12 characters. This link can be used only once.</p><form id="resetPassword" class="form-stack"><label>New password<input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label>Confirm new password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><div id="resetStatus" role="status"></div><button class="btn primary" type="submit">Update Password</button></form><p><a href="/dashboard.html">Return to sign in</a></p></section></main><script>
const form=document.getElementById('resetPassword'),status=document.getElementById('resetStatus'),token=new URLSearchParams(location.search).get('token')||'';history.replaceState(null,'',location.pathname);
if(!token){status.className='error';status.textContent='This reset link is invalid or incomplete.';form.querySelector('button').disabled=true}
form.onsubmit=async event=>{event.preventDefault();status.textContent='';const password=document.getElementById('newPassword').value,confirm=document.getElementById('confirmPassword').value;if(password!==confirm){status.className='error';status.textContent='The passwords do not match.';return}try{const response=await fetch('/api/auth/password-reset/complete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,newPassword:password})}),body=await response.json();if(!response.ok)throw new Error(body.error||'Unable to reset password.');status.className='success';status.textContent=body.message;form.reset();setTimeout(()=>location.href='/dashboard.html',1500)}catch(error){status.className='error';status.textContent=error.message}};
</script></body></html>
