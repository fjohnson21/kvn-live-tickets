<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thank You • Acts 2:44</title><link rel="stylesheet" href="/styles.css"></head><body>
<header class="nav"><a class="brand" href="/"><span class="brand-mark">KV</span><span>KINGDOM VIBE</span></a></header>
<main class="shell"><section class="hero" style="min-height:75vh"><div><span class="kicker">ACTS 2:44</span><h1>Thank<br><span>You.</span></h1><p id="summary">Verifying your contribution…</p><a class="btn primary" href="https://kvnlive.com">Return to Kingdom Vibe Live</a></div><div class="hero-card"><span class="badge">COMMUNITY IMPACT</span><strong>Your participation helps us serve beyond the event.</strong><p>No event admission or merchandise is attached to this contribution.</p></div></section></main>
<script>const p=new URLSearchParams(location.search);fetch('/api/donations/session?session_id='+encodeURIComponent(p.get('session_id')||'')).then(r=>r.json()).then(d=>{if(d.error)throw new Error(d.error);const amt=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((d.donation.amount||0)/100);summary.textContent=d.paymentStatus==='paid'?'Contribution confirmed: '+amt+'. Thank you for participating in Acts 2:44.':'Payment status: '+d.paymentStatus;}).catch(e=>summary.textContent=e.message)</script></body></html>
